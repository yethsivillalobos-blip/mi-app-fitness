<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitTrack Local</title>
    
    <!-- Enlaces PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="apple-touch-icon" href="icon.png">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #3498db;
            --primary-dark: #2980b9;
            --text-main: #ffffff;
            --text-sec: #a0a0a0;
            --danger: #e74c3c;
            --success: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 70px;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        h1 { font-size: 1.2rem; font-weight: 600; }

        .tab-content {
            display: none;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #333;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-sec);
            text-decoration: none;
            font-size: 0.75rem;
            cursor: pointer;
            width: 25%;
        }

        .nav-item i { font-size: 1.2rem; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--primary);
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-sec);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }

        input:focus, select:focus { outline: none; border-color: var(--primary); }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-danger {
            background-color: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            margin-top: 10px;
            padding: 10px;
        }

        .row { display: flex; gap: 10px; }
        .col { flex: 1; }

        .result-box {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: center;
        }
        .result-value { font-size: 1.8rem; font-weight: bold; color: var(--success); margin: 5px 0; }

        .timer-display {
            font-size: 3.5rem;
            font-weight: bold;
            text-align: center;
            font-family: monospace;
            margin: 20px 0;
            color: var(--text-main);
        }

        .timer-controls { display: flex; gap: 10px; justify-content: center; }
        .timer-btn { padding: 15px 30px; border-radius: 50px; border: none; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        .btn-start { background-color: var(--success); color: white; }
        .btn-stop { background-color: var(--danger); color: white; }

        .photo-preview {
            width: 100%; height: 200px;
            background-color: #2c2c2c;
            border-radius: 8px; border: 2px dashed #555;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; margin-bottom: 15px;
        }
        .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
        .photo-placeholder { color: #777; text-align: center; }

        .food-item {
            display: flex; background: #2a2a2a;
            border-radius: 8px; padding: 10px;
            margin-bottom: 10px; align-items: center;
        }
        .food-item img { width: 60px; height: 60px; border-radius: 6px; object-fit: cover; margin-right: 15px; }
        
        /* CORRECCIÓN DEL CSS AQUÍ */
        .food-item-info { flex-grow: 1; } 
        .food-item-title { font-weight: bold; }
        .food-item-macros { font-size: 0.8rem; color: var(--text-sec); }
        .delete-btn { color: var(--danger); background: none; border: none; font-size: 1.2rem; padding: 10px; cursor: pointer;}

        .accordion {
            background-color: #2c2c2c; color: var(--text-main);
            cursor: pointer; padding: 18px; width: 100%;
            text-align: left; border: none; outline: none;
            border-radius: 8px; margin-bottom: 5px;
            font-weight: bold; font-size: 1rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .accordion.active, .accordion:hover { background-color: #3a3a3a; }
        .accordion:after { content: '\002B'; color: var(--text-sec); font-weight: bold; }
        .accordion.active:after { content: "\2212"; }
        .panel { padding: 0 18px; background-color: var(--bg-color); max-height: 0; overflow: hidden; transition: max-height 0.2s ease-out; }
